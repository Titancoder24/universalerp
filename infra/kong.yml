_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth-route
        paths:
          - /auth/v1/
        strip_path: true

  - name: rest
    url: http://rest:3000/
    routes:
      - name: rest-route
        paths:
          - /rest/v1/
        strip_path: true

  - name: realtime
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1/
        strip_path: true

  - name: storage
    url: http://storage:5000/
    routes:
      - name: storage-route
        paths:
          - /storage/v1/
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
        - X-Client-Info
        - Range
      exposed_headers:
        - X-Total-Count
        - Content-Range
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 600
      policy: local
